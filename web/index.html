<title>Wordsearch Solver</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: the letter grid on the left, the word list beside it (below it on phones). Warm paper look with serif letters. */
  :root {
    --bg: #f4efe3;
    --surface: #fffdf7;
    --ink: #26231e;
    --muted: #7b7366;
    --line: #e2dac9;
    --accent: #9b783d;
    --accent-ink: #ffffff;
    --tile: #fffdf7;
    --solve: #9b783d;
    --solve-ink: #ffffff;
    --tile-edge: #ddd3bf;
    --tile-side: #ddd3bf;
    --tile-removed: #cfcdc9;
    --tile-removed-stripe: #c4c2bd;
    --font-display: "Fraunces", Georgia, "Times New Roman", serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1c1e; --surface: #242527; --ink: #f1eee8; --muted: #a8a49c; --line: #36373a;
      --accent: #e0b467; --accent-ink: #1b1c1e; --solve: #e0b467; --solve-ink: #1b1c1e;
      --tile: #343537; --tile-side: #3d3e41; --tile-edge: #8f8d89;
      --tile-removed: #121314; --tile-removed-stripe: #1e1f21;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1c1e; --surface: #242527; --ink: #f1eee8; --muted: #a8a49c; --line: #36373a;
    --accent: #e0b467; --accent-ink: #1b1c1e; --solve: #e0b467; --solve-ink: #1b1c1e;
    --tile: #343537; --tile-side: #3d3e41; --tile-edge: #8f8d89;
    --tile-removed: #121314; --tile-removed-stripe: #1e1f21;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
  }
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding-block: 20px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  h1, h2 {
    font-family: var(--font-display);
    margin: 0;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  h1 { font-size: 1.75rem; font-weight: 800; }
  h2 { font-size: 1.35rem; font-weight: 800; }
  .sub { color: var(--muted); margin: 2px 0 0; font-size: 0.9rem; }
  .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .theme-toggle { flex-shrink: 0; min-height: 40px; padding: 0 12px; font-size: 0.9rem; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 16px;
  }
  label.field {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
  }
  select {
    font: 500 1rem var(--font-body);
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 10px;
    min-height: 40px;
  }
  .spacer { flex: 1; }

  button {
    font: 600 1rem var(--font-body);
    border-radius: 10px;
    min-height: 44px;
    padding: 0 16px;
    cursor: pointer;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
  }
  button.primary {
    background: var(--solve);
    border-color: var(--solve);
    color: var(--solve-ink);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.1rem;
    width: 100%;
    min-height: 52px;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible, select:focus-visible, .tile:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---------- grid ---------- */
  .board {
    container-type: inline-size;
    width: min(100%, calc(var(--cols) * 84px));
    margin: 0 auto;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(var(--cols), 1fr);
    gap: clamp(2px, calc(16cqw / var(--cols)), 10px);
  }
  .tile {
    aspect-ratio: 1;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    border: 1px solid var(--tile-side);
    border-bottom: 4px solid var(--tile-edge);
    border-radius: clamp(4px, calc(56cqw / var(--cols)), 16px);
    background: var(--tile);
    color: var(--ink);
    text-align: center;
    padding: 0;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: calc(52cqw / var(--cols));
    text-transform: uppercase;
    caret-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
    transition: background-color 120ms ease, border-color 120ms ease;
  }
  .tile:focus { border-color: var(--accent); background: var(--surface); outline: none; }
  .tile.removed {
    background: repeating-linear-gradient(135deg, var(--tile-removed) 0 6px, var(--tile-removed-stripe) 6px 12px);
    border-color: var(--tile-removed);
    color: transparent;
  }
  .tile.path { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .tile.path-start { border-color: var(--ink); }
  .board { position: relative; }
  .path-line {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: visible;
  }
  .path-line polyline {
    fill: none;
    stroke: var(--ink);
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.45;
  }

  .search { display: flex; flex-direction: column; gap: 6px; }
  .search input {
    font: 600 1rem var(--font-display);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 0 12px;
    min-height: 44px;
    width: 100%;
  }
  .search input::placeholder { text-transform: none; letter-spacing: 0; font-family: var(--font-body); font-weight: 400; color: var(--muted); }
  .search input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .search-msg { margin: 0; font-size: 0.85rem; color: var(--muted); min-height: 1.3em; }

  .hint { color: var(--muted); font-size: 0.85rem; margin: 0; text-align: center; }
  .status {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 0.85rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .example-note {
    background: var(--surface);
    border: 1px dashed var(--line);
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 0.85rem;
    color: var(--muted);
    margin: 0;
  }

  /* ---------- results ---------- */
  .results-head {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    justify-content: space-between;
    gap: 10px 16px;
  }
  .summary { color: var(--muted); font-size: 0.9rem; margin: 2px 0 0; }
  .summary strong { color: var(--ink); font-family: var(--font-display); letter-spacing: 0.02em; }
  .groups { display: flex; flex-direction: column; gap: 6px; }
  .group {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    min-width: 0;
  }
  .group h3 {
    margin: 0 0 8px;
    font-family: var(--font-display);
    font-size: 1rem;
    font-weight: 700;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .group h3 .count {
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 0.8rem;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .words {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 14px;
    margin: 0;
    padding: 0;
    list-style: none;
    font-family: var(--font-display);
    font-weight: 500;
    letter-spacing: 0.04em;
    user-select: text;
  }
  .empty {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    color: var(--muted);
    text-align: center;
  }
  .loading { color: var(--muted); text-align: center; }

  /* ---------- side-by-side layout ---------- */
  /* Phones: the word list sits below the grid. Wide screens: it sits to the right and scrolls on its own. */
  .layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
  #grid-view { width: 100%; max-width: 560px; margin: 0 auto; }
  .stale-note {
    margin: 0;
    padding: 8px 12px;
    border-radius: 10px;
    border: 1px solid var(--accent);
    color: var(--ink);
    background: var(--surface);
    font-size: 0.85rem;
  }
  .word {
    font: inherit;
    letter-spacing: inherit;
    min-height: 0;
    padding: 2px 6px;
    margin: 0 -6px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: var(--ink);
    touch-action: manipulation; /* no double-tap zoom on phones */
    user-select: none;
  }
  .word:hover { background: var(--bg); }
  .word.active { background: var(--accent); color: var(--accent-ink); }
  .word.crossed { text-decoration: line-through 2px; color: var(--muted); }
  .word.crossed.active { color: var(--accent-ink); }
  .word:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  @media (min-width: 900px) {
    .layout { grid-template-columns: minmax(0, 560px) minmax(0, 1fr); align-items: start; }
    #grid-view { margin: 0; }
    #results-view {
      position: sticky;
      top: 16px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      padding-right: 4px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .tile { transition: none; }
  }
</style>
<script>
  // Apply a saved light/dark choice before the page draws, so it doesn't flash the other theme.
  try {
    const saved = localStorage.getItem("solvetungle-theme");
    if (saved === "light" || saved === "dark") document.documentElement.dataset.theme = saved;
  } catch (e) { /* storage unavailable: follow the system setting */ }
</script>

<main>
  <header class="top">
    <div>
      <h1>Wordsearch Solver</h1>
    </div>
    <button type="button" class="theme-toggle" id="theme-toggle">Dark mode</button>
  </header>

  <div class="layout">
  <section id="grid-view" aria-label="Letter grid">
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="controls">
        <label class="field" for="rows">Rows
          <select id="rows"></select>
        </label>
        <label class="field" for="cols">Columns
          <select id="cols"></select>
        </label>
        <span class="spacer"></span>
        <button type="button" id="clear">Clear</button>
      </div>

      <p class="example-note" id="example-note" hidden>These are example letters. Tap Clear to start your own grid.</p>

      <div class="board" id="board">
        <div class="grid" id="grid"></div>
        <svg class="path-line" id="path-line" aria-hidden="true"></svg>
      </div>

      <p class="hint" id="hint">Double-tap or press and hold a square to remove it. Do it again to bring it back.</p>

      <div class="status">
        <span id="fill-status"></span>
        <span id="bank-status">Loading word list…</span>
      </div>

      <div class="search" id="search" hidden>
        <label class="field" for="search-input">Find a word</label>
        <input id="search-input" type="search" autocomplete="off" autocapitalize="characters"
               autocorrect="off" spellcheck="false" enterkeyhint="done"
               placeholder="Type a word to see its path">
        <p class="search-msg" id="search-msg" aria-live="polite"></p>
      </div>

      <button type="button" class="primary" id="solve" hidden>Solve</button>
    </div>
  </section>

  <section id="results-view" aria-label="Words found">
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="results-head">
        <div>
          <h2 id="results-title"></h2>
          <p class="summary" id="results-summary"></p>
        </div>
        <label class="field" for="sort">Sort
          <select id="sort">
            <option value="length">Length, then A–Z</option>
            <option value="letter">A–Z, then length</option>
          </select>
        </label>
      </div>
      <p class="stale-note" id="stale-note" hidden>The grid has changed since you solved it. Press Solve to update this list.</p>
      <div class="groups" id="groups"></div>
    </div>
  </section>
  </div>
</main>

<script src="solver.js"></script>
<script>
(() => {
  const SIZE_CHOICES = Array.from({ length: 17 }, (_, i) => i + 4); // 4 to 20
  const SQUARE_ONLY_ABOVE = 9; // a grid with more rows or columns than this must be square
  const EXAMPLE = { rows: 4, cols: 4, letters: "SERSPATGLINESERS".split(""), removed: Array(16).fill(false) };
  const STORAGE_KEY = "solvetungle-state";
  const LONG_PRESS_MS = 450;

  const $ = (id) => document.getElementById(id);
  const gridEl = $("grid");
  const boardEl = $("board");

  // ---------- state ----------
  let state = loadState() || { ...EXAMPLE, letters: [...EXAMPLE.letters], removed: [...EXAMPLE.removed], example: true };
  let sortMode = state.sort || "length";
  let bank = null;
  let foundWords = new Set();
  let tiles = [];

  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (saved && saved.letters && saved.letters.length === saved.rows * saved.cols
          && SIZE_CHOICES.includes(saved.rows) && SIZE_CHOICES.includes(saved.cols)
          && (saved.rows === saved.cols || Math.max(saved.rows, saved.cols) <= SQUARE_ONLY_ABOVE)) {
        if (!Array.isArray(saved.removed) || saved.removed.length !== saved.letters.length) {
          saved.removed = Array(saved.letters.length).fill(false);
        }
        return saved;
      }
    } catch (e) { /* storage unavailable: start from the example */ }
    return null;
  }
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...state, sort: sortMode }));
    } catch (e) {  }
  }

  fetch("words.txt")
    .then((r) => {
      if (!r.ok) throw new Error(r.status);
      return r.text();
    })
    .then((text) => {
      bank = buildWordBank(text);
      $("bank-status").textContent = `${bank.size.toLocaleString()} words loaded`;
      updateStatus();
    })
    .catch(() => {
      $("bank-status").textContent = "Couldn't load the word list. Reload the page to try again.";
    });

  // ---------- grid ----------
  function fillSelect(select, value) {
    select.innerHTML = SIZE_CHOICES.map((n) => `<option value="${n}">${n}</option>`).join("");
    select.value = String(value);
  }
  fillSelect($("rows"), state.rows);
  fillSelect($("cols"), state.cols);

  function resize(rows, cols) {
    // Keep letters that still fit in the new size.
    const letters = [];
    const removed = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const inside = r < state.rows && c < state.cols;
        letters.push(inside ? state.letters[r * state.cols + c] : "");
        removed.push(inside ? state.removed[r * state.cols + c] : false);
      }
    }
    state = { rows, cols, letters, removed, example: false };
    buildGrid();
  }

  function buildGrid() {
    boardEl.style.setProperty("--cols", state.cols);
    gridEl.innerHTML = "";
    tiles = [];
    for (let i = 0; i < state.rows * state.cols; i++) {
      const tile = document.createElement("input");
      tile.className = "tile";
      tile.type = "text";
      tile.inputMode = "text";
      tile.autocomplete = "off";
      tile.setAttribute("autocapitalize", "characters");
      tile.setAttribute("autocorrect", "off");
      tile.spellcheck = false;
      tile.id = `tile-${i}`;
      tile.setAttribute("aria-label", `Row ${Math.floor(i / state.cols) + 1}, column ${(i % state.cols) + 1}`);
      tile.value = state.letters[i];
      setupTile(tile, i);
      gridEl.appendChild(tile);
      tiles.push(tile);
      applyRemoved(i);
    }
    updateStatus();
    saveState();
  }

  function setupTile(tile, i) {
    tile.addEventListener("focus", () => tile.select());

    tile.addEventListener("input", () => {
      // The new letter is just before the cursor; fall back to the last letter in the box.
      const typed = tile.value[(tile.selectionStart || tile.value.length) - 1] || "";
      const letter = (/^[a-z]$/i.test(typed) ? typed : tile.value.replace(/[^a-z]/gi, "").slice(-1)).toUpperCase();
      tile.value = letter;
      state.letters[i] = letter;
      state.example = false;
      if (letter) focusNext(i);
      updateStatus();
      saveState();
    });

    tile.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !tile.value) {
        e.preventDefault();
        focusPrevious(i, true);
      } else if (e.key === "Enter" && isFull()) {
        solve();
      }
    });

    // Press and hold (touch) or double-click (mouse) to remove / restore.
    let timer = null;
    let startX = 0;
    let startY = 0;
    tile.addEventListener("pointerdown", (e) => {
      startX = e.clientX;
      startY = e.clientY;
      clearTimeout(timer);
      timer = setTimeout(() => {
        timer = null;
        toggleRemoved(i);
      }, LONG_PRESS_MS);
    });
    const cancel = () => { clearTimeout(timer); timer = null; };
    tile.addEventListener("pointerup", cancel);
    tile.addEventListener("pointercancel", cancel);
    tile.addEventListener("pointerleave", cancel);
    tile.addEventListener("pointermove", (e) => {
      if (Math.hypot(e.clientX - startX, e.clientY - startY) > 10) cancel();
    });
    tile.addEventListener("contextmenu", (e) => e.preventDefault());
    tile.addEventListener("dblclick", () => {
      cancel();
      toggleRemoved(i);
    });
  }

  function toggleRemoved(i) {
    state.removed[i] = !state.removed[i];
    state.example = false;
    applyRemoved(i);
    if (state.removed[i]) tiles[i].blur();
    updateStatus();
    saveState();
  }

  function applyRemoved(i) {
    const tile = tiles[i];
    const removed = state.removed[i];
    tile.classList.toggle("removed", removed);
    tile.readOnly = removed;
    tile.value = removed ? "" : state.letters[i]; // the letter is kept and comes back on restore
    const where = `Row ${Math.floor(i / state.cols) + 1}, column ${(i % state.cols) + 1}`;
    tile.setAttribute("aria-label", removed ? `${where}, removed` : where);
  }

  function focusNext(i) {
    for (let j = i + 1; j < tiles.length; j++) {
      if (!state.removed[j]) { tiles[j].focus(); return; }
    }
    tiles[i].blur(); // last square: close the keyboard so Solve is visible
  }

  function focusPrevious(i, clear) {
    for (let j = i - 1; j >= 0; j--) {
      if (!state.removed[j]) {
        if (clear) {
          tiles[j].value = "";
          state.letters[j] = "";
          updateStatus();
          saveState();
        }
        tiles[j].focus();
        return;
      }
    }
  }

  function activeCount() { return state.removed.filter((r) => !r).length; }
  function filledCount() { return state.letters.filter((l, i) => l && !state.removed[i]).length; }
  function isFull() { return activeCount() > 0 && filledCount() === activeCount(); }

  function updateStatus() {
    const active = activeCount();
    const removed = state.removed.length - active;
    let text = `${filledCount()} of ${active} squares filled`;
    if (removed) text += ` · ${removed} removed`;
    $("fill-status").textContent = text;
    $("solve").hidden = !isFull();
    $("solve").disabled = !bank;
    $("solve").textContent = bank ? "Solve" : "Loading word list…";
    $("example-note").hidden = !state.example;
    $("stale-note").hidden = solvedKey === null || solvedKey === JSON.stringify(currentGrid());
    runSearch();
  }

  // ---------- find a word ----------
  let pathCells = []; // tile indexes of the highlighted word, in order
  let solvedKey = null; // the grid the results list was made from
  let crossedWords = new Set(); // words crossed out in the current results list
  const wideQuery = matchMedia("(min-width: 900px)"); // results beside the grid, not below it

  function currentGrid() {
    const grid = [];
    for (let r = 0; r < state.rows; r++) {
      const row = [];
      for (let c = 0; c < state.cols; c++) {
        const i = r * state.cols + c;
        row.push(state.removed[i] ? null : state.letters[i]);
      }
      grid.push(row);
    }
    return grid;
  }

  function runSearch() {
    const full = isFull();
    $("search").hidden = !full;
    const word = $("search-input").value.replace(/[^a-z]/gi, "").toUpperCase();
    let path = null;
    let msg = "";
    if (full && word) {
      path = findPath(currentGrid(), word);
      msg = path
        ? `Found ${word}, starting at row ${path[0][0] + 1}, column ${path[0][1] + 1}.`
        : `${word} can't be traced through touching squares in this grid.`;
    }
    $("search-msg").textContent = msg;
    pathCells = path ? path.map(([r, c]) => r * state.cols + c) : [];
    tiles.forEach((tile, i) => {
      tile.classList.toggle("path", pathCells.includes(i));
      tile.classList.toggle("path-start", pathCells[0] === i);
    });
    drawPath();
    // Mark the word in the results list too, if it's there.
    document.querySelectorAll(".word").forEach((b) => b.classList.toggle("active", !!path && b.dataset.word === word));
  }

  function drawPath() {
    const svg = $("path-line");
    svg.innerHTML = "";
    if (pathCells.length < 2 || !boardEl.clientWidth) return;
    svg.setAttribute("viewBox", `0 0 ${boardEl.clientWidth} ${boardEl.clientHeight}`);
    const points = pathCells.map((i) => {
      const t = tiles[i];
      return `${t.offsetLeft + t.offsetWidth / 2},${t.offsetTop + t.offsetHeight / 2}`;
    });
    const line = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    line.setAttribute("points", points.join(" "));
    line.setAttribute("stroke-width", Math.max(3, tiles[0].offsetWidth * 0.12));
    svg.appendChild(line);
  }
  new ResizeObserver(drawPath).observe(boardEl);

  $("search-input").addEventListener("input", runSearch);
  $("search-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") $("search-input").blur(); // close the phone keyboard
  });

  // Grids bigger than SQUARE_ONLY_ABOVE must be square, so changing one size can change the other.
  function changeSize(changed, other) {
    const size = +$(changed).value;
    if (size > SQUARE_ONLY_ABOVE || +$(other).value > SQUARE_ONLY_ABOVE) $(other).value = String(size);
    resize(+$("rows").value, +$("cols").value);
  }
  $("rows").addEventListener("change", () => changeSize("rows", "cols"));
  $("cols").addEventListener("change", () => changeSize("cols", "rows"));
  $("clear").addEventListener("click", () => {
    state = {
      rows: state.rows,
      cols: state.cols,
      letters: Array(state.rows * state.cols).fill(""),
      removed: Array(state.rows * state.cols).fill(false),
      example: false,
    };
    $("search-input").value = "";
    buildGrid();
    tiles[0].focus();
  });
  $("solve").addEventListener("click", solve);

  // ---------- results ----------
  function solve() {
    if (!bank || !isFull()) return;
    foundWords = findWords(currentGrid(), bank);
    solvedKey = JSON.stringify(currentGrid());
    crossedWords = new Set(); // each solve starts with nothing crossed out
    renderResults();
    updateStatus();
    if (!wideQuery.matches) $("results-view").scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function renderResults() {
    const container = $("groups");
    container.innerHTML = "";
    if (solvedKey === null) {
      $("results-title").textContent = "Words";
      $("results-summary").textContent = "Fill in every square and press Solve. The words will show up here.";
      return;
    }

    const total = foundWords.size;
    $("results-title").textContent = `Found ${total.toLocaleString()} word${total === 1 ? "" : "s"}`;

    updateSummary();

    const groups = sortMode === "letter" ? groupByLetter(foundWords) : groupByLength(foundWords);
    if (!groups.length) {
      container.innerHTML = '<p class="empty">No words found in this grid.</p>';
      return;
    }
    for (const g of groups) {
      const section = document.createElement("section");
      section.className = "group";
      const h = document.createElement("h3");
      h.textContent = g.name;
      const count = document.createElement("span");
      count.className = "count";
      count.textContent = `${g.words.length}`;
      h.appendChild(count);
      const list = document.createElement("ul");
      list.className = "words";
      for (const w of g.words) {
        const li = document.createElement("li");
        const button = document.createElement("button");
        button.type = "button";
        button.className = crossedWords.has(w) ? "word crossed" : "word";
        button.setAttribute("aria-pressed", crossedWords.has(w));
        button.dataset.word = w;
        button.textContent = w;
        li.appendChild(button);
        list.appendChild(li);
      }
      section.append(h, list);
      container.appendChild(section);
    }
    runSearch(); // re-mark the highlighted word in the new list
  }

  function updateSummary() {
    let longest = "";
    for (const w of foundWords) {
      if (w.length > longest.length || (w.length === longest.length && w < longest)) longest = w;
    }
    let text = longest
      ? `Longest: <strong>${longest}</strong> (${longest.length} letters). Click a word to see its path; double-click to cross it out.`
      : "";
    if (crossedWords.size) text += ` ${crossedWords.size.toLocaleString()} crossed out.`;
    $("results-summary").innerHTML = text;
  }

  // Clicking a word shows its path in the grid; double-clicking (or double-tapping) crosses it out or back in.
  // Double-clicks are timed here because phones don't reliably send dblclick for a double tap.
  const DOUBLE_CLICK_MS = 350;
  let lastClick = { word: null, time: 0 };
  let scrollTimer = null;
  $("groups").addEventListener("click", (e) => {
    const button = e.target.closest(".word");
    if (!button) return;
    const w = button.dataset.word;
    const now = Date.now();
    if (lastClick.word === w && now - lastClick.time < DOUBLE_CLICK_MS) {
      if (crossedWords.has(w)) crossedWords.delete(w);
      else crossedWords.add(w);
      button.classList.toggle("crossed", crossedWords.has(w));
      button.setAttribute("aria-pressed", crossedWords.has(w));
      updateSummary();
      clearTimeout(scrollTimer); // stay on the list after crossing out
      lastClick = { word: null, time: 0 }; // a third click starts over
      return;
    }
    lastClick = { word: w, time: now };
    $("search-input").value = w;
    runSearch();
    // On phones the grid is above the list: scroll up to it, but only once a second tap can't follow.
    clearTimeout(scrollTimer);
    if (!wideQuery.matches) {
      scrollTimer = setTimeout(() => boardEl.scrollIntoView({ behavior: "smooth", block: "center" }), DOUBLE_CLICK_MS);
    }
  });

  // ---------- light / dark mode ----------
  // With no saved choice the page follows the system setting; the button saves an explicit one.
  const darkQuery = matchMedia("(prefers-color-scheme: dark)");
  function currentTheme() {
    return document.documentElement.dataset.theme || (darkQuery.matches ? "dark" : "light");
  }
  function updateThemeButton() {
    $("theme-toggle").textContent = currentTheme() === "dark" ? "Light mode" : "Dark mode";
  }
  $("theme-toggle").addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("solvetungle-theme", next); } catch (e) { /* not saved */ }
    updateThemeButton();
  });
  darkQuery.addEventListener("change", updateThemeButton);
  updateThemeButton();

  $("sort").value = sortMode;
  $("sort").addEventListener("change", () => {
    sortMode = $("sort").value;
    saveState();
    renderResults();
  });

  buildGrid();
  renderResults();
  // Older versions showed results at #results; drop it from saved links.
  if (location.hash === "#results") history.replaceState(null, "", location.pathname + location.search);
})();
</script>
